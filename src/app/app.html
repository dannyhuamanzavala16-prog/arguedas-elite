@if (!authService.isLoaded()) {
  <div class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-login-gradient text-white">
    <div class="relative flex flex-col items-center justify-center p-md">
      <!-- Outer Pulsing Circle -->
      <div class="absolute w-32 h-32 rounded-full border-4 border-primary/30 animate-pulse"></div>
      
      <!-- Logo Container -->
      <div class="relative w-24 h-24 rounded-full bg-surface-container-lowest flex items-center justify-center shadow-lg mb-md">
        <img src="images/logo.png" alt="Logo" class="w-20 h-20 rounded-full" />
      </div>

      <!-- Spinner -->
      <div class="w-12 h-12 border-4 border-white/20 border-t-white rounded-full animate-spin"></div>
      
      <p class="font-headline-sm text-headline-sm tracking-wide mt-md text-primary animate-pulse">
        ARGUEDAS ELITE
      </p>
      <p class="font-body-sm text-body-sm text-white/60 uppercase tracking-widest mt-xs">
        Cargando sistema...
      </p>
    </div>
  </div>
}

<router-outlet />
<app-toast-container />
<app-confirm-dialog />
