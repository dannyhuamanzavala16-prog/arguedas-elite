<div class="flex min-h-screen bg-[#f5f5f5] overflow-x-hidden">
  <!-- Mobile Sidebar Overlay -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 bg-black/50 z-40 md:hidden transition-opacity duration-300" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar -->
  <aside class="fixed md:fixed top-0 bottom-0 left-0 flex flex-col h-full w-sidebar-width bg-primary text-on-primary border-r border-outline/10 py-md z-50 transition-transform duration-300"
         [class.translate-x-0]="sidebarOpen()"
         [class.-translate-x-full]="!sidebarOpen()"
         [class.md:translate-x-0]="true">
    
    <!-- Sidebar Header (includes mobile close button) -->
    <div class="px-md mb-xl flex justify-between items-center">
      <div>
        <h1 class="font-headline-md text-headline-md font-bold text-tertiary-fixed">Elite Academy</h1>
        <p class="font-label-sm text-label-sm text-on-primary/60 mt-1 uppercase tracking-wider">Portal del Estudiante</p>
      </div>
      <button class="w-9 h-9 md:hidden flex items-center justify-center rounded-lg text-on-primary/70 hover:bg-white/10 transition-colors"
              (click)="closeSidebar()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Navigation links -->
    <nav class="flex-1 flex flex-col gap-1">
      @for (link of sidebarLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="sidebar-link-active"
          [routerLinkActiveOptions]="{ exact: link.path === '/estudiante/dashboard' }"
          class="sidebar-link"
          (click)="closeSidebar()"
        >
          <span class="material-symbols-outlined">{{ link.icon }}</span>
          <span class="font-label-md text-label-md">{{ link.label }}</span>
        </a>
      }
    </nav>

    <!-- Logout -->
    <div class="px-md mt-auto pt-md border-t border-on-primary/10">
      <a
        routerLink="/login"
        class="flex items-center gap-sm text-on-primary/70 px-md py-sm hover:text-on-primary transition-all"
        (click)="auth.logout()"
      >
        <span class="material-symbols-outlined">logout</span>
        <span class="font-label-md text-label-md">Cerrar sesión</span>
      </a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 md:pl-sidebar-width flex flex-col min-h-screen min-w-0">
    <!-- Header -->
    <header class="sticky top-0 z-30 flex justify-between items-center w-full px-md md:px-xl h-16 bg-surface shadow-sm gap-sm">
      <!-- Hamburger Menu for Mobile -->
      <button class="w-10 h-10 md:hidden flex items-center justify-center rounded-lg text-on-surface-variant hover:bg-surface-container transition-colors"
              (click)="toggleSidebar()">
        <span class="material-symbols-outlined">menu</span>
      </button>

      <div class="flex items-center gap-md ml-auto">
        <div class="flex items-center gap-sm">
          <span class="font-label-md text-label-md font-bold text-primary truncate max-w-[150px] sm:max-w-none">{{ displayName }}</span>
          <div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container overflow-hidden border border-outline/10 shrink-0">
            @let foto = auth.getUsuario()?.foto;
            @if (foto) {
              <img [src]="foto" alt="Foto de perfil" class="w-full h-full object-cover">
            } @else {
              <span class="material-symbols-outlined" style="font-size: 24px;">person</span>
            }
          </div>
        </div>
      </div>
    </header>

    <!-- Content Outlet -->
    <div class="flex-1 p-md md:p-lg">
      <router-outlet />
    </div>
  </main>
</div>
