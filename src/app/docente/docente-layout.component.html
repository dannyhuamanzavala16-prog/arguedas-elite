<div class="flex min-h-screen bg-[#f5f5f5] font-body-md text-on-surface">
  <!-- Mobile Overlay -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 z-40 bg-black/50 md:hidden transition-opacity"
      (click)="closeSidebar()"
    ></div>
  }

  <!-- Sidebar (shared between desktop fixed & mobile slide-in) -->
  <aside
    class="fixed left-0 top-0 h-full w-sidebar-width bg-primary text-on-primary border-r border-outline/10 py-md z-50 flex flex-col transition-transform duration-300 ease-in-out md:translate-x-0"
    [class.translate-x-0]="sidebarOpen()"
    [class.-translate-x-full]="!sidebarOpen()"
  >
    <!-- Brand -->
    <div class="px-md mb-xl flex items-center justify-between">
      <div>
        <h1 class="font-headline-md text-headline-md font-bold text-tertiary-fixed">Elite Academy</h1>
        <p class="font-label-sm text-label-sm text-on-primary/60 mt-1 uppercase tracking-wider">Panel de Docente</p>
      </div>
      <!-- Close button (mobile only) -->
      <button
        class="md:hidden w-9 h-9 flex items-center justify-center rounded-lg text-on-primary/70 hover:text-on-primary hover:bg-white/10 transition-colors"
        (click)="closeSidebar()"
      >
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 flex flex-col gap-1">
      @for (link of sidebarLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="sidebar-link-active"
          [routerLinkActiveOptions]="{ exact: link.path === '/docente/dashboard' }"
          class="sidebar-link"
          (click)="closeSidebar()"
        >
          <span class="material-symbols-outlined">{{ link.icon }}</span>
          <span class="font-label-md text-label-md">{{ link.label }}</span>
        </a>
      }
    </nav>

    <!-- Logout -->
    <div class="px-md mt-auto pt-md border-t border-on-primary/10">
      <button
        type="button"
        class="w-full flex items-center gap-sm text-on-primary/70 px-md py-sm hover:text-on-primary transition-all"
        (click)="auth.logoutAndRedirect(); closeSidebar()"
      >
        <span class="material-symbols-outlined">logout</span>
        <span class="font-label-md text-label-md">Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 md:ml-sidebar-width flex flex-col min-h-screen">
    <!-- Header -->
    <header class="sticky top-0 z-30 flex justify-between items-center w-full px-md md:px-xl h-16 bg-surface shadow-sm">
      <!-- Hamburger (mobile only) -->
      <button
        class="md:hidden w-10 h-10 flex items-center justify-center rounded-lg text-on-surface hover:bg-surface-container transition-colors"
        (click)="toggleSidebar()"
      >
        <span class="material-symbols-outlined">menu</span>
      </button>

      <!-- Spacer on desktop -->
      <div class="hidden md:block"></div>

      <div class="flex items-center gap-md ml-auto">
        <div class="flex items-center gap-sm">
          <span class="font-label-md text-label-md font-bold text-primary">{{ displayName }}</span>
          <div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container overflow-hidden border border-outline/10">
            @let foto = auth.getUsuario()?.foto;
            @if (foto) {
              <img [src]="foto" alt="Foto de perfil" class="w-full h-full object-cover">
            } @else {
              <span class="material-symbols-outlined" style="font-size: 24px;">person</span>
            }
          </div>
        </div>
      </div>
    </header>

    <!-- Child routes -->
    <router-outlet />
  </main>
</div>
